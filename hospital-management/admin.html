<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- LOGIN -->
    <div id="loginBox" class="vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4 shadow" style="width:350px;">
            <h4 class="text-center">Admin Login</h4>
            <input type="text" id="username" class="form-control mb-2" placeholder="Username">
            <input type="password" id="password" class="form-control mb-3" placeholder="Password">
            <button onclick="login()" class="btn btn-primary w-100">Login</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="d-none">

        <nav class="navbar navbar-dark bg-dark px-3">
            <span class="navbar-brand">Admin Panel</span>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </nav>

        <div class="container mt-4">

            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card p-3 text-center shadow">
                        <h6>Total Appointments</h6>
                        <h3 id="totalCount"></h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3 text-center shadow">
                        <h6>Pending</h6>
                        <h3 id="pendingCount"></h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3 text-center shadow">
                        <h6>Approved</h6>
                        <h3 id="approvedCount"></h3>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <canvas id="deptChart"></canvas>
                </div>
                <div class="col-md-6">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

            <input type="text" id="search" class="form-control mb-3" placeholder="Search by Name" onkeyup="loadTable()">

            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableData"></tbody>
            </table>

        </div>
    </div>

    <script src="js/admin.js"></script>
</body>

</html>
